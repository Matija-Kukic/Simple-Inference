[project]
name = "qwen_inference"
version = "0.1.0"
description = "Simple qwen3 inference in cuda."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "accelerate>=1.15.0",
    "torch>=2.13.0",
    "transformers>=5.17.0",
]

[project.scripts]
inference = "qwen_inference:main"
inference-test = "qwen_inference:test"
hf-ref = "qwen_inference:reference_inference"
ctokens = "qwen_inference:create_tokens"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.14"
