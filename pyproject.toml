[project]
name = "inference_py"
version = "0.1.0"
description = "Simple qwen3 inference in cuda."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "torch>=2.13.0",
]

[project.scripts]
inference = "inference_py:main"
inference-test = "inference_py:test"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
